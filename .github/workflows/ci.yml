name: Tests
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: python -m pip install -e './sdk[openai,anthropic,langchain]'
      - run: npm run test:sdk
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: CHROME_PATH=$(find ~/.cache/ms-playwright -path '*/chrome-linux*/chrome' -type f | head -1) npm run test:ui
      - run: CHROME_PATH=$(find ~/.cache/ms-playwright -path '*/chrome-linux*/chrome' -type f | head -1) npm run test:dark
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-previews
          path: artifacts/
