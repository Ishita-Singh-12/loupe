[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loupe-agent"
version = "0.1.0"
description = "Non-blocking trace instrumentation for the Loupe agent observability dashboard"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.0,<3"]
anthropic = ["anthropic>=0.30,<1"]
langchain = ["langchain-core>=0.3,<2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["loupe*"]
